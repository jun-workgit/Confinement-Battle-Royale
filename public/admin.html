// Immediate-effect assignment (like room drag-drop, not part of the batched
// edit/commit flow) — only the roles in this game's pool are offered, and
// whichever one is already taken by another player is shown disabled.
function openRoleAssignModal(p, state) {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-card role-assign-modal">
      <div class="modal-title">为玩家 ${p.id} 选择职业</div>
      <div class="role-select-grid">
        <div class="role-select-chip ${!p.roleId ? "selected" : ""}" data-role-id="">
          <div class="role-select-chip-empty">✕</div>
          <span>未分配</span>
        </div>
        ${state.selectedRoles.map((rid) => {
          const role = getRole(rid);
          const takenBy = state.players.find((pp) => pp.roleId === rid && pp.id !== p.id);
          return `
            <div class="role-select-chip ${p.roleId === rid ? "selected" : ""} ${takenBy ? "disabled" : ""}" data-role-id="${rid}">
              <img src="${role.image}" alt="${role.name}">
              <span>${role.name}${takenBy ? `（玩家${takenBy.id}）` : ""}</span>
            </div>`;
        }).join("")}
      </div>
      <div class="modal-actions">
        <button class="btn secondary role-assign-close">关闭</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  function close() { document.body.removeChild(overlay); }
  overlay.querySelector(".role-assign-close").addEventListener("click", close);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
  overlay.querySelectorAll(".role-select-chip:not(.disabled)").forEach((chip) => {
    chip.addEventListener("click", () => {
      socket.send({ type: "admin:assignPlayerRole", playerId: p.id, roleId: chip.dataset.roleId || null, password: adminPassword });
      close();
    });
  });
}

// Immediate-effect item-card inventory editor (道具卡 7-14) opened from the
// 🎒 icon in 玩家属性's 负重 column. Knife/pistol/shotgun are +/- steppers
// (stackable); the other five are single-instance across the whole game --
// clicking one on a player who doesn't have it transfers it from whoever
// currently does (server enforces this in admin:setPlayerItems; the chip
// here just shows who that is beforehand).
function openInventoryModal(p, state) {
  let items = { ...(p.items || defaultPlayerItems()) };
  // Local mirror of "who (if anyone) holds each unique item across ALL
  // players", updated optimistically alongside `items` on every click. The
  // modal doesn't re-render on incoming broadcasts (it's outside the normal
  // panel re-render cycle), so without this the "held by" note would show
  // stale data until the server's reply round-trips back.
  const liveState = latestState || state;
  const uniqueHolders = {};
  for (const key of UNIQUE_ITEM_KEYS) {
    const holder = liveState.players.find((pp) => pp.items && pp.items[key]);
    uniqueHolders[key] = holder ? holder.id : null;
  }

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-card room-info inventory-modal">
      <div class="modal-title">玩家 ${p.id} · 道具卡</div>
      <div id="inventory-body"></div>
      <div class="modal-actions">
        <button class="btn secondary inventory-close">关闭</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const body = overlay.querySelector("#inventory-body");

  function sendItems() {
    socket.send({ type: "admin:setPlayerItems", playerId: p.id, items, password: adminPassword });
  }

  function renderBody() {
    body.innerHTML = `
      <div style="font-weight:700;font-size:13px;margin:10px 0 6px;color:#d8b258;">武器（可持有多张）</div>
      <div class="inventory-stackable-grid">
        ${STACKABLE_ITEM_KEYS.map((key) => {
          const def = ITEM_DEFS[key];
          const count = items[key] || 0;
          return `
            <div class="inventory-stackable-row">
              <span>${def.icon} ${def.label}（+${def.power}武力/张）</span>
              <div style="display:flex;align-items:center;gap:8px;">
                <button class="stepper-btn sm" data-item-key="${key}" data-item-delta="-1" ${count <= 0 ? "disabled" : ""}>－</button>
                <span>${count}</span>
                <button class="stepper-btn sm" data-item-key="${key}" data-item-delta="1">＋</button>
              </div>
            </div>`;
        }).join("")}
      </div>
      <div style="font-weight:700;font-size:13px;margin:14px 0 6px;color:#d8b258;">全场唯一道具（点击可从持有者处转移）</div>
      <div class="inventory-unique-grid">
        ${UNIQUE_ITEM_KEYS.map((key) => {
          const def = ITEM_DEFS[key];
          const holderId = uniqueHolders[key];
          const heldByOtherId = holderId && holderId !== p.id ? holderId : null;
          const mine = !!items[key];
          return `
            <div class="inventory-unique-chip ${mine ? "selected" : ""}" data-item-key="${key}">
              <span>${def.icon} ${def.label}</span>
              ${heldByOtherId ? `<span class="inventory-holder-note">（玩家${heldByOtherId}持有）</span>` : ""}
            </div>`;
        }).join("")}
      </div>`;

    body.querySelectorAll("[data-item-key][data-item-delta]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const key = btn.dataset.itemKey;
        const delta = Number(btn.dataset.itemDelta);
        items = { ...items, [key]: Math.max(0, (items[key] || 0) + delta) };
        sendItems();
        renderBody();
      });
    });
    body.querySelectorAll(".inventory-unique-chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        const key = chip.dataset.itemKey;
        const nowMine = !items[key];
        items = { ...items, [key]: nowMine };
        uniqueHolders[key] = nowMine ? p.id : null;
        sendItems();
        renderBody();
      });
    });
  }
  renderBody();

  function close() { document.body.removeChild(overlay); }
  overlay.querySelector(".inventory-close").addEventListener("click", close);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
}

// 化学家's "毒性调和" (1 of 2 per round) -- set here, from the 地图 tab,
// BEFORE 结算 opens (same pre-结算 timing as floor votes/rocket target, and
// locked the same way once a draft exists for the round). "削弱" can only
// target a room whose floor is ALREADY poisoned coming into this round;
// "增强" has no target of its own -- it applies to whatever floor(s) this
// round's vote ends up newly poisoning, decided later at 结算.
function openChemistActionModal(state) {
  const current = state.chemistAction;
  const eligibleRooms = STOPPABLE_ROOM_IDS.filter((r) => isRoomPoisonedClient(r, state.poisonFloors, state.detoxifiedRooms));
  let type = current ? current.type : "";
  let room = current && current.type === "reduce" ? current.room : (eligibleRooms[0] || "");

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-card room-info chemist-action-modal">
      <div class="modal-title">🧪 化学家 · 毒性调和（2选1，可不使用）</div>
      <div style="display:flex;flex-direction:column;gap:10px;margin:12px 0;">
        <label style="display:flex;align-items:center;gap:8px;">
          <input type="radio" name="chemist-type" value="" ${!type ? "checked" : ""}> 本轮不使用
        </label>
        <label style="display:flex;align-items:center;gap:8px;">
          <input type="radio" name="chemist-type" value="reduce" ${type === "reduce" ? "checked" : ""}> 削弱：指定已中毒房间本轮-2（最低为0）
        </label>
        <div id="chemist-room-row" style="margin-left:26px;${type === "reduce" ? "" : "display:none;"}">
          <select id="chemist-room-select" ${eligibleRooms.length ? "" : "disabled"}>
            ${eligibleRooms.length ? eligibleRooms.map((r) => `<option value="${r}" ${r === room ? "selected" : ""}>${getRoomLabel(r)}</option>`).join("") : `<option value="">暂无已中毒房间</option>`}
          </select>
        </div>
        <label style="display:flex;align-items:center;gap:8px;">
          <input type="radio" name="chemist-type" value="boost" ${type === "boost" ? "checked" : ""}> 增强：本轮新增毒气楼层伤害+2
        </label>
      </div>
      <div class="modal-actions">
        <button class="btn secondary chemist-action-cancel">取消</button>
        <button class="btn chemist-action-confirm">确认</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  const roomRow = overlay.querySelector("#chemist-room-row");
  const roomSelect = overlay.querySelector("#chemist-room-select");
  overlay.querySelectorAll('input[name="chemist-type"]').forEach((radio) => {
    radio.addEventListener("change", () => {
      type = radio.value;
      roomRow.style.display = type === "reduce" ? "" : "none";
    });
  });
  if (roomSelect) {
    roomSelect.addEventListener("change", () => { room = roomSelect.value; });
  }

  function close() { document.body.removeChild(overlay); }
  overlay.querySelector(".chemist-action-cancel").addEventListener("click", close);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
  overlay.querySelector(".chemist-action-confirm").addEventListener("click", () => {
    let action = null;
    if (type === "reduce" && room) action = { type: "reduce", room };
    else if (type === "boost") action = { type: "boost" };
    socket.send({ type: "admin:setChemistAction", action, password: adminPassword });
    close();
  });
}

// 102 (激光室)'s "经过或停留...扣1点生命" isn't something this app can
// detect on its own (it only knows a player's final room, not their real
// walking path) -- admin manually marks it by dragging a player's token
// onto 102 itself ("stop") or the dedicated red zone next to it ("pass"),
// see attachMeepleDrag's onUp. A REAL, immediate health change (not
// deferred to 结算, unlike every other pre-结算 map setting above), so it's
// confirmed here rather than applied silently on every drop.
function openLaserMarkConfirmModal(playerId, kind, state, onDone) {
  const player = state.players.find((p) => p.id === playerId);
  if (!player) { if (onDone) onDone(); return; }
  if (player.health <= 0) {
    showAdminToast(`玩家 ${playerId} 已成为暗影，不再受激光室影响`);
    if (onDone) onDone();
    return;
  }
  const existing = state.laserMarks && state.laserMarks[playerId];
  if (existing && existing.round === state.round) {
    showAdminToast(`玩家 ${playerId} 本轮已标记过 102 激光室`);
    if (onDone) onDone();
    return;
  }
  const verb = kind === "stop" ? "停留在" : "经过";
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-card room-info laser-mark-modal">
      <div class="modal-title">🔴 102 激光室</div>
      <div style="margin:12px 0;font-size:14px;">玩家 ${playerId} 本轮${verb} 102 激光室，是否标记扣除 1 点生命？</div>
      <div class="modal-actions">
        <button class="btn secondary laser-mark-cancel">不标记</button>
        <button class="btn laser-mark-confirm">标记 -1 生命</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  // Only ONE of these mark-confirm modals is ever open at a time (see
  // onUp's chaining via onDone) -- two stacked full-screen overlays used to
  // leave the SECOND one sitting invisibly behind the first if admin only
  // noticed and dismissed the front one, silently eating every click/drag
  // afterward since it still covered the whole screen.
  function close() { document.body.removeChild(overlay); if (onDone) onDone(); }
  overlay.querySelector(".laser-mark-cancel").addEventListener("click", close);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
  overlay.querySelector(".laser-mark-confirm").addEventListener("click", () => {
    socket.send({ type: "admin:setLaserMark", playerId, action: "add", password: adminPassword });
    close();
  });
}

// Offered when dragging an already-marked player OUT of 201 -- they can
// also just click the badge directly, this just meets admin at the point
// where undoing the mark is most likely to be the intent.
function openGeneMarkLeaveConfirmModal(playerId, state, onDone) {

// Same 10-point-pool stepper UI/logic as index.html's renderStatsEditor
// (mirrored, not shared, since that one sends user:setStats and lives in a
// completely separate view) -- edits stay local to this modal's own draft
// until "保存" sends the whole reallocation at once.
// Unlike the player's own initial allocation (index.html's renderStatsEditor,
// bound by the 10-point pool), B304's reallocation has no upper cap at all --
// each stepper just increments/decrements freely (floor of 0), matching
// clampAdminStats server-side rather than clampPlayerStats.
function renderStatsReallocBody(bodyEl, draftStats) {
  const sum = STAT_DEFS.reduce((s, d) => s + (draftStats[d.id] || 0), 0);
  bodyEl.innerHTML = `
    <div class="points-left" style="margin-left:0;margin-bottom:10px;">当前总计：${sum}（B304 重新分配不受常规10点上限限制）</div>
    ${STAT_DEFS.map((d) => {
      const v = draftStats[d.id] || 0;
      const pct = Math.min(100, (v / STAT_POINTS_TOTAL) * 100);
      return `
      <div class="stat-row-v2">
        <div class="diamond-badge"><span>${d.icon}</span></div>
        <div class="stat-row-v2-body">
          <div class="stat-row-v2-label">${d.label}</div>
          <div class="stat-bar-track"><div class="stat-bar-thumb" style="left:${pct}%;"></div></div>
        </div>
        <div class="stat-row-v2-steppers">
          <button class="stepper-btn sm" data-action="dec" data-stat="${d.id}" ${v <= 0 ? "disabled" : ""}>－</button>
          <div class="stat-row-v2-value compact">${v}</div>
          <button class="stepper-btn sm" data-action="inc" data-stat="${d.id}">＋</button>
        </div>
      </div>`;
    }).join("")}
  `;
  bodyEl.querySelectorAll(".stepper-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const statId = btn.dataset.stat;
      const delta = btn.dataset.action === "inc" ? 1 : -1;
      draftStats[statId] = Math.max(0, (draftStats[statId] || 0) + delta);
      renderStatsReallocBody(bodyEl, draftStats);
    });
  });
}

// Human-readable label for one playerLogs entry's source/detail — mirrors
// the wording used in the settlement accordions themselves so admin can
// cross-reference a log line against what they saw while settling that round.
function playerLogSourceLabel(entry) {
  const adrenalineSuffix = entry.detail.adrenalineSaved ? "（💉 肾上腺素保护，本应死亡）" : "";
  return playerLogSourceLabelBase(entry) + adrenalineSuffix;
}

function playerLogSourceLabelBase(entry) {
  switch (entry.source) {
    case "surgery": return "手术室 · 手术成功";
    case "combat": {
      // A Round-0 player can carry BOTH a role-assignment bonus and a real
      // spawn-room fight in the same entry -- neither should silently hide
      // the other, so build up whichever parts actually apply.
      const parts = [];
      if (entry.detail.roleBonus) {
        const role = getRole(entry.detail.roleBonus.roleId);
        parts.push(`职业加成 · ${role ? role.name : entry.detail.roleBonus.roleId}`);
      }
      if (entry.detail.kind) {
        const kindLabel = { single: "单挑", multi: "乱斗" };
        let base = `战斗 · ${kindLabel[entry.detail.kind] || entry.detail.kind}`;
        if (entry.detail.autoLoss) base += "（对方持枪，己方无枪，直接判负）";
        parts.push(base);
      }
      return parts.join("；") || "战斗";
    }
    case "shadow_meet": return "暗影相遇";
    case "poison": {
      const chemistText = entry.detail.chemistAdjust > 0 ? "（🧪 化学家增强+2）" : entry.detail.chemistAdjust < 0 ? "（🧪 化学家削弱-2）" : "";
      return `毒气 · ${entry.detail.floor ? entry.detail.floor + " 楼" : "-"}${entry.detail.gasMaskImmune ? "（😷 防毒面具免疫，未受伤害）" : ""}${chemistText}`;
    }
    case "hunger": {
      const missing = [];
      if (entry.detail.missingWater) missing.push("缺水");
      if (entry.detail.missingFood) missing.push("缺粮");
      return `水粮上交 · ${missing.join("、") || "-"}`;
    }
    case "rocket": return "火箭筒袭击";
    case "items": {
      const parts = [];
      if (entry.detail.pill) parts.push("药片");
      if (entry.detail.wine) parts.push(`酒（骰子${entry.detail.wineResult != null ? entry.detail.wineResult : "?"}）`);
      if (entry.detail.adrenaline) parts.push("肾上腺素");
      return `道具卡 · ${parts.join("、") || "-"}`;
    }
    case "revival": return `暗影复活 · 吸收 ${entry.detail.absorbed}${entry.detail.revived ? "（已复活）" : "（尚未复活）"}`;
    case "laser102": return "102 激光室 · 经过/停留（管理员标记）";
    case "gene201": return "201 基因库 · 经过/停留（管理员标记，三项属性各+1）";
    case "b304": return "B304 操作室 · 重新分配基因点数";
    case "manual": return "管理员手动调整";
    default: return entry.source;
  }
}

function playerLogStatText(statDeltas) {
  if (!statDeltas) return "-";
  const parts = [];
  if (statDeltas.power) parts.push(`武力${statDeltas.power > 0 ? "+" : ""}${statDeltas.power}`);
  if (statDeltas.speed) parts.push(`速度${statDeltas.speed > 0 ? "+" : ""}${statDeltas.speed}`);
  if (statDeltas.weight) parts.push(`负重${statDeltas.weight > 0 ? "+" : ""}${statDeltas.weight}`);
  return parts.join("，") || "-";
}

// Read-only audit trail for one player: every REAL (committed) health/stat
// change, grouped by round in chronological order. Uncommitted or undone
// settlement work never reaches state.playerLogs (see buildSettlementLogEntries
// in server.js), so what's shown here is exactly what actually happened —
// this is the tool for admin to double-check a round's math after the fact.
function openPlayerLogModal(playerId, state) {
  const logs = (state.playerLogs && state.playerLogs[playerId]) || [];
  const byRound = {};
  for (const entry of logs) {
    (byRound[entry.round] = byRound[entry.round] || []).push(entry);
  }
  const rounds = Object.keys(byRound).map(Number).sort((a, b) => a - b);

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-card room-info player-log-modal">
      <div class="modal-title">玩家 ${playerId} · 状态变化日志</div>
      ${rounds.length ? rounds.map((r) => `
        <div class="player-log-round">
          <div class="player-log-round-title">第 ${r} 回合</div>
          <div style="overflow-x:auto;"><table class="stats-table">
            <thead><tr><th>来源</th><th>位置</th><th>生命变化</th><th>属性变化</th></tr></thead>
            <tbody>${byRound[r].map((entry) => `
              <tr>
                <td>${playerLogSourceLabel(entry)}</td>
                <td>${entry.room ? getRoomLabel(entry.room) : "-"}</td>
                <td>${entry.healthDelta ? `${entry.healthBefore} → ${entry.healthAfter}（${entry.healthDelta > 0 ? "+" : ""}${entry.healthDelta}）` : "-"}</td>
                <td>${playerLogStatText(entry.statDeltas)}</td>
              </tr>`).join("")}</tbody>
          </table></div>
        </div>`).join("") : `<div style="color:#8b9482;text-align:center;padding:20px 0;">暂无记录</div>`}
      <div class="modal-actions">
        <button class="btn secondary player-log-close">关闭</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  function close() { document.body.removeChild(overlay); }
  overlay.querySelector(".player-log-close").addEventListener("click", close);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
}

function wirePlayerLogButtons(container, state) {
  container.querySelectorAll(".log-btn[data-log-pid]").forEach((btn) => {
    btn.addEventListener("click", () => openPlayerLogModal(Number(btn.dataset.logPid), state));
  });
}

// Immediate-effect +/- stepper for a role's tracked skill-use count (see
// ROLE_SKILL_LIMITS in roles-data.js) — same "just a bookkeeping mark, not
// part of the batched edit/confirm flow" pattern as the room-drag/role-assign
// actions. Shows nothing for a role with no tracked skill (or no role at all).
function skillUsesCellHtml(p, state) {
  // 意见领袖's "ability" is cast entirely through floor-vote drags on the
  // 地图 tab (see floorVoteCapFor/floorVoteUsedFor), not a manual stepper --
  // read-only here, same "X/Y" wording as that tab's own display.
  if (p.roleId === "opinion_leader") {
    return `<span>${floorVoteUsedFor(p, state)}/${floorVoteCapFor(p, state) - 1}</span>`;
  }
  if (!p.roleId || !(p.roleId in ROLE_SKILL_LIMITS)) return "-";
  const cap = ROLE_SKILL_LIMITS[p.roleId];
  const used = p.skillUses || 0;
  const label = cap === null ? `已用 ${used} 次（无限）` : `${used}/${cap}`;
  // The server only accepts this once the game is in progress (skills are
  // used during actual play, not prep) -- disable both steppers before then
  // so a click doesn't silently no-op.
  const locked = state.phase !== "in_progress";
  return `
    <div style="display:flex;align-items:center;gap:6px;justify-content:center;">
      <button class="stepper-btn sm" data-skill-pid="${p.id}" data-skill-delta="-1" ${locked || used <= 0 ? "disabled" : ""}>－</button>
      <span>${label}</span>
      <button class="stepper-btn sm" data-skill-pid="${p.id}" data-skill-delta="1" ${locked || (cap !== null && used >= cap) ? "disabled" : ""}>＋</button>
    </div>`;
}

function renderPlayersTable(tbody, state) {
  const roomCounts = {};
  for (const pl of state.players) {
    if (pl.room) roomCounts[pl.room] = (roomCounts[pl.room] || 0) + 1;
  }
  const conflictColors = assignRoomConflictColors(roomCounts);

  const reviveThreshold = state.reviveThreshold || DEFAULT_REVIVE_THRESHOLD;
  tbody.innerHTML = state.players.map((p) => {
    const protectedNow = p.adrenalineProtectedRound === state.round;
    if (isEditing) {
      const d = draft.players[p.id];
      const dead = d.health <= 0;
      const badges = weaponBadgesHtml(p.items);
      return `<tr>
        <td>玩家 ${p.id}</td>
        <td>${healthCellHtml(p.id, d.health, true, d.adrenaline, reviveThreshold)}</td>
        <td><button class="btn ${dead ? "" : "secondary"}" data-toggle-dead="${p.id}" style="padding:5px 10px;font-size:12px;">${dead ? "复活" : "标记死亡"}</button></td>
        <td>${statsReadyTagHtml(d.stats)}</td>
        <td>${roomLabelHtml(p.room, roomCounts, conflictColors)}</td>
        <td>${fieldStepperHtml(p.id, "power", d.stats.power)}${badges ? `<div style="font-size:11px;color:#8b9482;">${badges}</div>` : ""}</td>
        <td>${fieldStepperHtml(p.id, "speed", d.stats.speed)}</td>
        <td>${fieldStepperHtml(p.id, "weight", d.stats.weight)}<div style="margin-top:4px;">${weightCellHtml(p)}</div></td>
        ${state.rolesEnabled ? `<td>${roleAssignButtonHtml(p)}</td><td>${skillUsesCellHtml(p, state)}</td>` : ""}
      </tr>`;
    }
    const dead = p.health <= 0;
    const sumClass = (p.stats.power + p.stats.speed + p.stats.weight) >= STAT_POINTS_TOTAL ? "sum-full" : "";
    return `<tr>
      <td>玩家 ${p.id}</td>
      <td>${healthCellHtml(p.id, p.health, false, protectedNow, reviveThreshold)}</td>
      <td><span class="pill-tag ${dead ? "purple" : "green"}">${dead ? "暗影" : "存活"}</span></td>
      <td>${statsReadyTagHtml(p.stats)}</td>
      <td>${roomLabelHtml(p.room, roomCounts, conflictColors)}</td>
      <td class="${sumClass}">${powerCellHtml(p)}</td>
      <td>${speedCellHtml(p, protectedNow)}</td>
      <td>${weightCellHtml(p)}</td>
      ${state.rolesEnabled ? `<td>${roleAssignButtonHtml(p)}</td><td>${skillUsesCellHtml(p, state)}</td>` : ""}
    </tr>`;
  }).join("");

  tbody.querySelectorAll("[data-bag-pid]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const player = state.players.find((pp) => pp.id === Number(btn.dataset.bagPid));
      if (player) openInventoryModal(player, state);
    });
  });

  if (state.rolesEnabled) {
    tbody.querySelectorAll(".role-assign-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const player = state.players.find((pp) => pp.id === Number(btn.dataset.pid));
        if (player) openRoleAssignModal(player, state);
      });
    });
    tbody.querySelectorAll("[data-skill-pid]").forEach((btn) => {
      btn.addEventListener("click", () => {
        socket.send({
          type: "admin:adjustSkillUses",
          playerId: Number(btn.dataset.skillPid),
          delta: Number(btn.dataset.skillDelta),
          password: adminPassword,
        });
      });
    });
  }

  if (isEditing) {
    tbody.querySelectorAll(".edit-input").forEach((input) => {
      input.addEventListener("change", () => {
        const pid = Number(input.dataset.pid);
        const field = input.dataset.field;
        const v = Math.round(Number(input.value) || 0);
        if (field === "health") draft.players[pid].health = v;
        else draft.players[pid].stats[field] = Math.max(0, v);
        render();
      });
    });
    tbody.querySelectorAll("[data-delta]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const pid = Number(btn.dataset.pid);
        const field = btn.dataset.field;
        const delta = Number(btn.dataset.delta);
        const d = draft.players[pid];
        if (field === "health") {
          d.health += delta;
        } else {
          d.stats[field] = Math.max(0, d.stats[field] + delta);
        }
        render();
      });
    });
    tbody.querySelectorAll("[data-toggle-dead]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const pid = Number(btn.dataset.toggleDead);
        const d = draft.players[pid];
        // Death always sets health to exactly -(this game's revive
        // threshold) -- see server.js's commitSectionEffect -- not a
        // hardcoded -2, so this manual toggle stays correct even when
        // admin has raised the threshold for the round.
        d.health = d.health <= 0 ? DEFAULT_HEALTH : -(state.reviveThreshold || DEFAULT_REVIVE_THRESHOLD);
        render();
      });
    });
    tbody.querySelectorAll("[data-toggle-adrenaline]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const pid = Number(btn.dataset.toggleAdrenaline);
        const d = draft.players[pid];
        d.adrenaline = !d.adrenaline;
        render();
      });
    });
  }
}

// Game-over still allows the same 编辑 flow as prep/in-progress (see
// startEdit/commitEdit/cancelEdit, shared module-level state) -- admin can
// keep correcting stats/health after the fact, and it's reflected on this
// same ranking table (and every other view's own results screen, since
// they all just render off the one broadcast state.players).
function renderEndedAdmin(state) {
  panel.innerHTML = `
    <div class="panel-header">
      <span class="panel-title">禁闭逃杀 · 管理员</span>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <span class="round-badge">第 <span class="round-number">${state.round}</span> 回合</span>
        ${isEditing
          ? `<button class="btn" id="commit-btn" style="padding:6px 14px;font-size:12px;">确认</button>
             <button class="btn secondary" id="cancel-btn" style="padding:6px 14px;font-size:12px;">取消</button>`
          : `<button class="btn secondary" id="edit-btn" style="padding:6px 14px;font-size:12px;">编辑</button>`}
      </div>
    </div>
    <div class="panel-body" style="display:flex;flex-direction:column;gap:24px;">
      <div class="card">
        <div style="font-weight:700;font-size:18px;margin-bottom:16px;text-align:center;">游戏结束 · 排行榜${isEditing ? "（编辑中，点击上方“确认”生效）" : ""}</div>
        ${isEditing ? `
          <div style="overflow-x:auto;">
            <table class="stats-table">
              <thead><tr><th>玩家</th><th>生命</th><th>状态</th><th>属性状态</th><th>位置</th><th>武力</th><th>速度</th><th>负重</th>${state.rolesEnabled ? "<th>职业</th><th>技能次数</th>" : ""}</tr></thead>
              <tbody id="players-tbody"></tbody>
            </table>
          </div>` : `<div style="overflow-x:auto;">${rankingTableHtml(state.players, { showRoles: state.rolesEnabled, showLogButton: true })}</div>`}
      </div>
      ${!isEditing ? `<div style="display:flex;justify-content:flex-end;">
        <button class="btn" id="restart-btn">重新开始游戏</button>
      </div>` : ""}
    </div>
  `;
  if (isEditing) {
    renderPlayersTable(panel.querySelector("#players-tbody"), state);
    panel.querySelector("#commit-btn").addEventListener("click", () => commitEdit(state));
    panel.querySelector("#cancel-btn").addEventListener("click", () => cancelEdit());
  } else {
    wirePlayerLogButtons(panel, state);
    panel.querySelector("#edit-btn").addEventListener("click", () => startEdit(state));
    panel.querySelector("#restart-btn").addEventListener("click", () => {
      if (confirm("确定要重新开始游戏吗？所有数据将被清除。")) {
        socket.send({ type: "admin:restartGame", password: adminPassword });
      }
    });
  }
}

boot();
</script>
</body>
</html>
