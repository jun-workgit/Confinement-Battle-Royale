<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>禁闭逃杀 — 管理员视图</title>
<link rel="icon" type="image/png" href="/assets/player-dead.png">
<link rel="stylesheet" href="/shared.css">
</head>
<body>
<div class="page">
  <div class="panel" id="panel">
    <div class="center-msg"><span class="big">加载中...</span></div>
  </div>
</div>

<script src="/map-data.js"></script>
<script src="/roles-data.js"></script>
<script src="/ws-client.js"></script>
<script src="/auth.js"></script>
<script>
const panel = document.getElementById("panel");
// Temporarily hidden — flip back to true to restore the import button.
// The underlying feature (importPlayersFromSheet, /api/import-players) is
// untouched, so re-enabling is just this one flag.
const SHOW_IMPORT_FEATURE = false;
const PW_KEY = "jbts_admin_pw";
let adminPassword = sessionStorage.getItem(PW_KEY);
let latestState = null;
let socket = null;

// One global edit mode covers every editable field (per-player stats/health,
// round, poison floors) so admin edits commit together in a single broadcast
// instead of field-by-field.
let isEditing = false;
let draft = null;
let adminTab = "players";

// The setup screen's 玩家人数 input, kept outside renderSetup() so it
// survives a re-render -- selecting/toggling a role sends admin:setRoleConfig,
// which broadcasts new state and re-renders the whole setup screen, which
// would otherwise reset the input back to its hardcoded default value.
let setupPlayerCount = 6;

// Settlement (结算阶段) — the actual draft lives server-side
// (state.settlementDraft). "取消结算" discards it entirely (admin:cancelSettlement)
// so re-entering always starts this round's settlement fresh, never mid-edit.
let inSettlement = false;
let expandedSettlementSection = "surgery";
const SETTLEMENT_SECTIONS = [
  { key: "surgery", title: "1. 手术室是否进行手术" },
  { key: "combat", title: "2. 哪些房间发生战斗、乱斗" },
  { key: "shadow_meet", title: "3. 哪些房间发生暗影与人相遇事件" },
  { key: "poison", title: "4. 哪个楼层成为“毒气”楼层" },
  { key: "hunger", title: "5. 水粮上交情况" },
  { key: "rocket", title: "6. 火箭筒袭击了哪个房间" },
  { key: "items", title: "7. 道具卡使用情况" },
  { key: "revival", title: "8. 哪些暗影玩家复活" },
];

function startEdit(state) {
  isEditing = true;
  draft = {
    players: Object.fromEntries(state.players.map((p) => [p.id, {
      stats: { ...p.stats }, health: p.health,
      // Whether THIS round is currently protected (see the clamp in
      // server.js's commitSectionEffect) -- toggleable here so admin can
      // grant/revoke it manually before 结算, same as if 肾上腺素 had
      // actually been used last round, without needing an item-card trail.
      adrenaline: p.adrenalineProtectedRound === state.round,
    }])),
    round: state.round,
    poisonFloors: new Set(state.poisonFloors),
  };
  render();
}

function cancelEdit() {
  isEditing = false;
  draft = null;
  render();
}

function commitEdit(state) {
  const payload = {
    type: "admin:commitEdits",
    players: Object.entries(draft.players).map(([id, v]) => ({ id: Number(id), stats: v.stats, health: v.health, adrenaline: v.adrenaline })),
    password: adminPassword,
  };
  if (state.phase === "in_progress") {
    payload.round = draft.round;
    payload.poisonFloors = [...draft.poisonFloors];
  }
  socket.send(payload);
  isEditing = false;
  draft = null;
}

// Pulls Strength/Speed/Capacity/End Room from the stats spreadsheet and
// applies them. Stats land in `draft` only (admin still has to click
// "确认" to commit — this button is only visible while isEditing), but
// room isn't part of the draft/commit flow in this app (it's always an
// immediate action, like the map drag-drop), so it's sent right away.
async function importPlayersFromSheet(state) {
  const btn = panel.querySelector("#import-btn");
  if (btn) { btn.disabled = true; btn.textContent = "导入中..."; }
  try {
    const res = await fetch(`/api/import-players?password=${encodeURIComponent(adminPassword)}`);
    const data = await res.json();
    if (!res.ok || !data.ok) {
      alert("导入失败：" + (data.error || "未知错误"));
      return;
    }
    let statsCount = 0, roomCount = 0;
    data.players.forEach((p) => {
      const d = draft.players[p.id];
      if (!d) return; // not a player in the current game
      if (p.strength != null) d.stats.power = Math.max(0, Math.round(p.strength));
      if (p.speed != null) d.stats.speed = Math.max(0, Math.round(p.speed));
      if (p.capacity != null) d.stats.weight = Math.max(0, Math.round(p.capacity));
      if (p.strength != null || p.speed != null || p.capacity != null) statsCount++;
      if (p.endRoom && STOPPABLE_ROOM_IDS.includes(p.endRoom)) {
        socket.send({ type: "admin:setPlayerRoom", playerId: p.id, room: p.endRoom, password: adminPassword });
        roomCount++;
      }
    });
    render();
    alert(`已导入 ${statsCount} 名玩家的属性、${roomCount} 个位置。属性仍需点击"确认"才会生效。`);
  } catch {
    alert("导入失败，请检查网络连接后重试。");
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "导入体测数据"; }
  }
}

async function boot() {
  if (adminPassword) {
    const ok = await verifyAdminPassword(adminPassword);
    if (!ok) {
      adminPassword = null;
      sessionStorage.removeItem(PW_KEY);
    }
  }
  if (adminPassword) startApp();
  else renderLogin();
}

function renderLogin() {
  panel.innerHTML = `
    <div class="panel-header"><span class="panel-title">禁闭逃杀 · 管理员</span></div>
    <div class="panel-body" style="display:flex;justify-content:center;">
      <div class="card" style="display:flex;flex-direction:column;gap:14px;width:320px;max-width:100%;">
        <div style="font-weight:700;font-size:16px;">管理员登录</div>
        <input type="password" id="login-pw" placeholder="密码" autocomplete="off">
        <div id="login-error" class="modal-error" style="display:none;">密码错误</div>
        <button class="btn" id="login-btn">登录</button>
      </div>
    </div>`;

  const attempt = async () => {
    const pw = panel.querySelector("#login-pw").value;
    const ok = await verifyAdminPassword(pw);
    if (ok) {
      adminPassword = pw;
      sessionStorage.setItem(PW_KEY, pw);
      startApp();
    } else {
      panel.querySelector("#login-error").style.display = "block";
    }
  };
  panel.querySelector("#login-btn").addEventListener("click", attempt);
  panel.querySelector("#login-pw").addEventListener("keydown", (e) => { if (e.key === "Enter") attempt(); });
  panel.querySelector("#login-pw").focus();
}

function startApp() {
  if (socket) { render(); return; }
  let pingHandler = null;
  socket = connectGameSocket((state) => {
    latestState = state;
    render();
  }, (ts) => { if (pingHandler) pingHandler(ts); });
  pingHandler = startPingIndicator(socket);
  startTimerTicker(() => latestState && latestState.timer);
}

// Countdown timer controls. Minute/second inputs live in the DOM between
// renders; they're only read when 设置 is clicked, and re-seeded from state on
// each render (renders only happen on broadcasts, not on local ticks).
function renderTimerTab(container, state) {
  const timer = state.timer || { durationSec: 0, remainingSec: 0, running: false, endsAt: null };
  const left = timerRemainingSec(timer);
  const mins = Math.floor(timer.durationSec / 60);
  const secs = timer.durationSec % 60;
  container.innerHTML = `
    <div class="card timer-card">
      <div style="font-weight:700;font-size:16px;">倒计时（所有视图同步显示）</div>
      <div class="timer-display" data-timer-clock>${formatTimerClock(left)}</div>
      <div class="timer-controls">
        <input type="number" id="timer-min" min="0" max="99" value="${mins}" ${timer.running ? "disabled" : ""}> 分
        <input type="number" id="timer-sec" min="0" max="59" value="${secs}" ${timer.running ? "disabled" : ""}> 秒
        <button class="btn secondary" id="timer-set-btn" ${timer.running ? "disabled" : ""}>设置</button>
      </div>
      <div class="timer-controls">
        ${timer.running
          ? `<button class="btn" id="timer-pause-btn">暂停</button>`
          : `<button class="btn" id="timer-start-btn" ${left <= 0 ? "disabled" : ""}>开始</button>`}
        <button class="btn secondary" id="timer-reset-btn" ${timer.durationSec <= 0 ? "disabled" : ""}>重置</button>
      </div>
    </div>`;
  container.querySelector("#timer-set-btn").addEventListener("click", () => {
    const m = Math.max(0, Math.min(99, Math.round(Number(container.querySelector("#timer-min").value) || 0)));
    const s = Math.max(0, Math.min(59, Math.round(Number(container.querySelector("#timer-sec").value) || 0)));
    socket.send({ type: "admin:setTimer", durationSec: m * 60 + s, password: adminPassword });
  });
  const startBtn = container.querySelector("#timer-start-btn");
  if (startBtn) startBtn.addEventListener("click", () => socket.send({ type: "admin:startTimer", password: adminPassword }));
  const pauseBtn = container.querySelector("#timer-pause-btn");
  if (pauseBtn) pauseBtn.addEventListener("click", () => socket.send({ type: "admin:pauseTimer", password: adminPassword }));
  container.querySelector("#timer-reset-btn").addEventListener("click", () => socket.send({ type: "admin:resetTimer", password: adminPassword }));
}

// Mirrors server.js's roomFloor() — only used client-side to label which
// floor a player's current room belongs to (poison section preview).
function roomFloorClient(roomId) {
  if (!roomId) return null;
  if (roomId[0] === "B") {
    const m = roomId.match(/^B(\d)/);
    return m ? "B" + m[1] : null;
  }
  if (roomId === "201" || roomId === "202") return "2";
  return "1";
}

// Mirrors server.js's isRoomPoisoned() -- B501 spans two floor bands on the
// map (see MULTI_FLOOR_ROOMS in map-data.js), so it only counts as poisoned
// once every floor it spans is. A detoxified room (B101 控制室's function 2)
// overrides this entirely, regardless of floor state.
function isRoomPoisonedClient(roomId, poisonedFloors, detoxifiedRooms) {
  if (detoxifiedRooms && detoxifiedRooms.includes(roomId)) return false;
  const floors = MULTI_FLOOR_ROOMS[roomId] || [roomFloorClient(roomId)];
  return floors.length > 0 && floors.every((f) => f && poisonedFloors.includes(f));
}

function settlementPlayerLabel(id) {
  return `玩家 ${id}`;
}

// Shared commit/undo/reset footer for every accordion section — mirrors the
// isEditing/draft pattern's commit/cancel buttons, but scoped to one section.
function settlementFooterHtml(sec) {
  return `
    <div class="settlement-footer">
      ${sec.committed
        ? `<button class="btn secondary" data-settlement-action="undo">编辑（撤销本项提交）</button>`
        : `<button class="btn" data-settlement-action="commit">提交</button>`}
      <button class="btn secondary" data-settlement-action="reset">重置本项</button>
    </div>`;
}

function wireSettlementFooter(container, key) {
  const commitBtn = container.querySelector('[data-settlement-action="commit"]');
  if (commitBtn) {
    commitBtn.addEventListener("click", () => {
      socket.send({ type: "admin:settlementCommitSection", section: key, password: adminPassword });
    });
  }
  const undoBtn = container.querySelector('[data-settlement-action="undo"]');
  if (undoBtn) {
    undoBtn.addEventListener("click", () => {
      socket.send({ type: "admin:settlementUndoSection", section: key, password: adminPassword });
    });
  }
  const resetBtn = container.querySelector('[data-settlement-action="reset"]');
  if (resetBtn) {
    resetBtn.addEventListener("click", () => {
      if (confirm("确定要重置本项吗？将撤销已提交的更改并恢复为自动检测结果。")) {
        socket.send({ type: "admin:settlementResetSection", section: key, password: adminPassword });
      }
    });
  }
}

// Before commit there's no sec.applied yet, so the "变化" column would just
// show "-" — which hides exactly the number admin needs to sanity-check
// before clicking 提交. previewSectionDeltas mirrors server.js's
// commitSectionEffect math exactly (read-only, no mutation) so every section
// can show its prospective delta ahead of time; the moment it's actually
// committed, the real sec.applied (computed server-side) takes over instead.
function computePoisonDamageClient(state) {
  const table = state.poisonDamageTable && state.poisonDamageTable.length ? state.poisonDamageTable : DEFAULT_POISON_DAMAGE_TABLE;
  const row = table.find((r) => r.round === state.round);
  return row ? row.damage : 0;
}

// Items live on state.players (not the settlement draft) -- admin doesn't
// edit inventory mid-settlement, so reading the live record is always safe.
function playerItemsClient(state, playerId) {
  const p = state.players.find((pp) => pp.id === playerId);
  return (p && p.items) || defaultPlayerItems();
}

// Round-0-only: how much of a player's power in this combat calc comes from
// a role-assignment bonus (see ROLE_ASSIGN_BONUSES) -- read-only lookup, used
// wherever combat math needs the boosted power without mutating draft.working
// (which is reused across re-renders, so mutating it here would compound).
function roleBonusPowerFor(playerId, roleBonuses) {
  const rb = roleBonuses && roleBonuses.find((r) => r.playerId === playerId);
  return (rb && rb.stats.power) || 0;
}

function previewSectionDeltas(key, sec, draft, state) {
  const healthDeltas = {};
  const statDeltas = {};
  const bump = (id, dh) => { healthDeltas[id] = (healthDeltas[id] || 0) + dh; };
  const find = (id) => draft.working.find((p) => p.id === id);
  let shadowEnvoyResonance = 0;
  const adrenalineSaved = new Set();
  const chemistAdjusted = new Map();

  if (key === "surgery") {
    if (sec.data.outcome === "success") {
      for (const id of sec.data.playerIds) bump(id, 4);
    }
  } else if (key === "combat") {
    if (sec.data.roleBonuses) {
      for (const rb of sec.data.roleBonuses) {
        statDeltas[rb.playerId] = { ...statDeltas[rb.playerId], ...rb.stats };
      }
    }
    for (const ev of sec.data.events) {
      if (ev.kind === "single") {
        const [aId, bId] = ev.playerIds;
        const a = find(aId), b = find(bId);
        if (!a || !b) continue;
        const aItems = playerItemsClient(state, aId);
        const bItems = playerItemsClient(state, bId);
        const aPower = a.stats.power + roleBonusPowerFor(aId, sec.data.roleBonuses) + weaponPowerBonus(aItems);
        const bPower = b.stats.power + roleBonusPowerFor(bId, sec.data.roleBonuses) + weaponPowerBonus(bItems);
        const aGun = hasGun(aItems), bGun = hasGun(bItems);
        if (aGun && !bGun) bump(bId, -aPower);
        else if (bGun && !aGun) bump(aId, -bPower);
        else {
          if (aPower > bPower) bump(bId, -(aPower - bPower));
          else if (bPower > aPower) bump(aId, -(bPower - aPower));
        }
      } else if (ev.kind === "multi") {
        const players = ev.playerIds.map(find).filter(Boolean);
        const powers = players.map((p) => ({ id: p.id, power: p.stats.power + roleBonusPowerFor(p.id, sec.data.roleBonuses) + weaponPowerBonus(playerItemsClient(state, p.id)) }));
        const maxPower = Math.max(...powers.map((x) => x.power));
        for (const { id, power } of powers) {
          const dmg = maxPower - power;
          if (dmg > 0) bump(id, -dmg);
        }
      }
    }
  } else if (key === "shadow_meet") {
    // Mirrors server.js's commitSectionEffect exactly -- 暗影共鸣 is ONE
    // trigger per Shadow that absorbs, not scaled by how much they took.
    for (const ev of sec.data.events) {
      const shadowCount = ev.playerIds.map(find).filter((p) => p && p.health <= 0).length;
      const livingCount = ev.playerIds.map(find).filter((p) => p && p.health > 0).length;
      const drainedLiving = ev.playerIds.map(find).filter((p) => p && p.health > 0 && p.roleId !== "shadow_envoy");
      for (const p of drainedLiving) {
        bump(p.id, -shadowCount);
      }
      for (const p of ev.playerIds.map(find).filter((p) => p && p.health <= 0)) {
        bump(p.id, livingCount);
        shadowEnvoyResonance += 1;
      }
    }
    if (shadowEnvoyResonance > 0) {
      const envoy = draft.working.find((p) => p.roleId === "shadow_envoy" && p.health > 0);
      if (envoy) bump(envoy.id, shadowEnvoyResonance);
    }
  } else if (key === "poison") {
    const baseDamage = computePoisonDamageClient(state);
    const chemistAction = sec.data.chemistAction;
    for (const p of draft.working) {
      if (p.health <= 0) continue;
      const realPlayer = state.players.find((pp) => pp.id === p.id);
      if (realPlayer && realPlayer.revivedProtectedRound === state.round) continue;
      if (!isRoomPoisonedClient(p.room, sec.data.floors, state.detoxifiedRooms) || playerItemsClient(state, p.id).gasMask) continue;
      // Mirrors server.js's commitSectionEffect exactly -- "reduce" only
      // matters for a room whose floor was ALREADY poisoned coming into this
      // round (state.poisonFloors, untouched until this section commits);
      // "boost" applies to every floor that newly becomes poisoned THIS
      // round, no target needed.
      let damage = baseDamage;
      if (chemistAction && chemistAction.type === "reduce" && chemistAction.room === p.room && isRoomPoisonedClient(chemistAction.room, state.poisonFloors, state.detoxifiedRooms)) {
        damage = Math.max(0, damage - 2);
        chemistAdjusted.set(p.id, -2);
      } else if (chemistAction && chemistAction.type === "boost") {
        const roomFloors = MULTI_FLOOR_ROOMS[p.room] || [roomFloorClient(p.room)];
        if (roomFloors.some((f) => (sec.data.newFloors || []).includes(f))) {
          damage = damage + 2;
          chemistAdjusted.set(p.id, 2);
        }
      }
      if (damage > 0) bump(p.id, -damage);
    }
  } else if (key === "hunger") {
    if (state.round >= 2) {
      for (const [playerId, t] of Object.entries(sec.data.toggles)) {
        if (t.exempt) continue;
        const missing = (t.water ? 0 : 1) + (t.food ? 0 : 1);
        if (missing > 0) bump(Number(playerId), -missing);
      }
    }
  } else if (key === "rocket") {
    if (sec.data.room) {
      for (const id of sec.data.playerIds) bump(id, -4);
    }
  } else if (key === "items") {
    for (const [playerId, t] of Object.entries(sec.data.toggles)) {
      const id = Number(playerId);
      if (t.pill) bump(id, 2);
      if (t.wine) {
        if (t.wineResult === 3) statDeltas[id] = { ...statDeltas[id], power: 1 };
        else if (t.wineResult === 4) statDeltas[id] = { ...statDeltas[id], speed: 1 };
        else if (t.wineResult === 5) statDeltas[id] = { ...statDeltas[id], weight: 1 };
        else if (t.wineResult === 6) bump(id, 2);
      }
    }
  } else if (key === "revival") {
    // Absorption itself already happened via "combat"'s shadow-meet event --
    // this section only finalizes anyone whose health has now reached >=0,
    // reviving them with the TOTAL absorbed since death (current health +
    // reviveThreshold, since death always starts them at exactly
    // -reviveThreshold -- see server.js's commitSectionEffect for why that
    // sum is always the true running total), mirrored here so the preview
    // matches what commit will actually record.
    const threshold = state.reviveThreshold || DEFAULT_REVIVE_THRESHOLD;
    for (const [playerId] of Object.entries(sec.data.absorbedThisRound)) {
      const id = Number(playerId);
      const p = find(id);
      if (p && p.health >= 0) {
        const clamped = Math.max(1, p.health + threshold);
        if (clamped !== p.health) bump(id, clamped - p.health);
      }
    }
  }

  // Mirrors server.js's commitSectionEffect exactly: 肾上腺素's health-floor
  // (can't die at all this round) takes precedence; otherwise crossing from
  // alive to dead in THIS section forces the death value to exactly
  // -reviveThreshold instead of whatever the raw delta would show, so the
  // preview matches what commit will actually record before admin even
  // clicks 提交.
  for (const idStr of Object.keys(healthDeltas)) {
    const id = Number(idStr);
    const p = find(id);
    if (!p) continue;
    const player = state.players.find((pp) => pp.id === id);
    const protectedNow = player && player.adrenalineProtectedRound === state.round;
    const before = p.health;
    let after = before + healthDeltas[idStr];
    if (protectedNow) {
      if (before > 0 && after <= 0) adrenalineSaved.add(id);
      if (after < 1) after = 1;
    } else if (before > 0 && after <= 0) {
      after = -(state.reviveThreshold || DEFAULT_REVIVE_THRESHOLD);
    }
    healthDeltas[idStr] = after - before;
  }

  return { healthDeltas, statDeltas, revivedIds: [], adrenalineSaved, chemistAdjusted };
}

function settlementHealthDelta(deltas, playerId) {
  return (deltas.healthDeltas && deltas.healthDeltas[playerId]) || 0;
}

// Pre-commit, draft.working hasn't been touched by this section yet, so the
// preview delta projects FORWARD from the current (live) health. Post-commit,
// the server snapshotted this section's own before/after at the moment it
// was actually committed (sec.applied.healthBefore/healthAfter) -- using
// THAT instead of the live health is what keeps an already-committed
// section's numbers frozen and accurate top-to-bottom, even after later
// sections keep mutating draft.working further.
function settlementBeforeAfter(sec, playerId, liveHealth, delta) {
  if (sec.committed && sec.applied && sec.applied.healthBefore && sec.applied.healthAfter
      && sec.applied.healthBefore[playerId] !== undefined && sec.applied.healthAfter[playerId] !== undefined) {
    return { before: sec.applied.healthBefore[playerId], after: sec.applied.healthAfter[playerId] };
  }
  return sec.committed
    ? { before: liveHealth - delta, after: liveHealth }
    : { before: liveHealth, after: liveHealth + delta };
}

// Every caller of this (surgery/combat/poison/hunger/rocket) is always a
// health change, so spelling out "生命" removes any doubt at a glance --
// only the items section has non-health deltas (stat bumps), and it builds
// its own labeled variance text separately for that reason.
function settlementDeltaText(delta, icon, committed) {
  if (!delta) return "-";
  const text = `${icon}生命${delta > 0 ? "+" : ""}${delta}`;
  return committed ? text : `<span class="settlement-preview-delta">${text}（预计）</span>`;
}

// Whether 肾上腺素 is the reason THIS section's damage stopped short of
// killing this player -- committed sections read the server's own recorded
// extra.adrenalineSaved (exact); an uncommitted section falls back to the
// same Set previewSectionDeltas just computed via the mirrored clamp logic.
function settlementAdrenalineSaved(sec, deltas, playerId) {
  if (sec.committed) {
    return !!(sec.applied && sec.applied.extra && sec.applied.extra.adrenalineSaved && sec.applied.extra.adrenalineSaved.includes(playerId));
  }
  return !!(deltas.adrenalineSaved && deltas.adrenalineSaved.has(playerId));
}

function settlementAdrenalineTagHtml(sec, deltas, playerId) {
  return settlementAdrenalineSaved(sec, deltas, playerId)
    ? `<span class="pill-tag amber" style="margin-left:6px;">💉 肾上腺素保护${sec.committed ? "" : "（预计）"}</span>`
    : "";
}

// 化学家's "毒性调和" adjustment for this player in the poison section, if
// any -- committed sections read the server's own recorded
// extra.chemistAdjusted (exact); an uncommitted section falls back to the
// Map previewSectionDeltas just computed via the mirrored logic.
function settlementChemistAdjust(sec, deltas, playerId) {
  if (sec.committed) {
    const m = sec.applied && sec.applied.extra && sec.applied.extra.chemistAdjusted;
    return m && m[playerId] !== undefined ? m[playerId] : null;
  }
  return deltas.chemistAdjusted && deltas.chemistAdjusted.has(playerId) ? deltas.chemistAdjusted.get(playerId) : null;
}

function settlementChemistTagHtml(sec, deltas, playerId) {
  const adjust = settlementChemistAdjust(sec, deltas, playerId);
  if (adjust == null) return "";
  const suffix = sec.committed ? "" : "（预计）";
  return adjust > 0
    ? `<span class="pill-tag red" style="margin-left:6px;">🧪 化学家增强+2${suffix}</span>`
    : `<span class="pill-tag green" style="margin-left:6px;">🧪 化学家削弱-2${suffix}</span>`;
}

// 入殓师's "每当有勇士变成暗影，你的负重永久+1" -- only ever known once the
// causing section has committed (unlike adrenaline/chemist, this isn't
// mirrored in previewSectionDeltas, so there's no "预计" variant here).
// Shown inline whenever the undertaker happens to already be part of the
// section's own shown rows (e.g. sharing the room where someone died);
// the settlement tab's summary line (see renderSettlementTab) is what
// covers every OTHER case where they aren't.
function settlementUndertakerTagHtml(sec, playerId) {
  const gains = sec.committed && sec.applied && sec.applied.extra && sec.applied.extra.undertakerGains;
  const n = gains && gains[playerId];
  if (!n) return "";
  return `<span class="pill-tag amber" style="margin-left:6px;">🪦 入殓师负重+${n}</span>`;
}

function settlementHealthText(value) {
  return `❤️${value}`;
}

// Switch-styled checkbox — same semantics/events as a plain checkbox (the
// class/data-* attributes and "checked"/"disabled" state are unchanged), just
// wrapped for the toggle-switch look instead of a bare square checkbox.
function settlementSwitchHtml(cls, dataAttrs, checked, disabled) {
  return `<label class="switch"><input type="checkbox" class="${cls}" ${dataAttrs} ${checked ? "checked" : ""} ${disabled ? "disabled" : ""}><span class="switch-slider"></span></label>`;
}

function renderSurgerySection(container, sec, draft, deltas) {
  const outcomeLabel = { success: "手术成功（在场每人 +4 生命）", fail: "手术失败，触发乱斗", none: "本轮无手术" }[sec.data.outcome];
  const involved = sec.data.playerIds.map((id) => draft.working.find((p) => p.id === id)).filter(Boolean);
  container.innerHTML = `
    <div style="margin-bottom:12px;font-size:14px;">检测结果：<b>${outcomeLabel}</b></div>
    ${involved.length ? `
      <div style="overflow-x:auto;"><table class="stats-table">
        <thead><tr><th>玩家</th><th>结算前</th><th>结算后</th><th>变化</th></tr></thead>
        <tbody>${involved.map((p) => {
          const delta = settlementHealthDelta(deltas, p.id);
          const { before, after } = settlementBeforeAfter(sec, p.id, p.health, delta);
          return `<tr><td>${settlementPlayerLabel(p.id)}</td><td>${settlementHealthText(before)}</td><td>${settlementHealthText(after)}</td><td>${settlementDeltaText(delta, "❤️", sec.committed)}</td></tr>`;
        }).join("")}</tbody>
      </table></div>` : `<div style="color:#8b9482;font-size:13px;">B202 手术室内存活人数不足以触发手术。</div>`}
    ${settlementFooterHtml(sec)}
  `;
  wireSettlementFooter(container, "surgery");
}

// Round-0-only: role-assignment bonuses (e.g. 驯兽师's permanent +1 武力/+1
// 负重) settled alongside spawn-room fights. Read-only -- these are fixed by
// ROLE_ASSIGN_BONUSES, nothing here for admin to edit before committing.
function roleBonusesHtml(roleBonuses) {
  if (!roleBonuses || !roleBonuses.length) return "";
  return `
    <div style="margin-bottom:16px;">
      <div style="font-weight:700;margin-bottom:6px;">职业加成</div>
      <div style="overflow-x:auto;"><table class="stats-table">
        <thead><tr><th>玩家</th><th>职业</th><th>加成</th></tr></thead>
        <tbody>${roleBonuses.map((rb) => {
          const role = getRole(rb.roleId);
          const parts = [];
          if (rb.stats.power) parts.push(`武力+${rb.stats.power}`);
          if (rb.stats.speed) parts.push(`速度+${rb.stats.speed}`);
          if (rb.stats.weight) parts.push(`负重+${rb.stats.weight}`);
          return `<tr><td>${settlementPlayerLabel(rb.playerId)}</td><td>${role ? role.name : rb.roleId}</td><td>${parts.join("，") || "-"}</td></tr>`;
        }).join("")}</tbody>
      </table></div>
    </div>`;
}

function renderCombatSection(container, sec, draft, deltas, state) {
  // Shadow-meet events are their own section now (see renderShadowMeetSection
  // below, resolved AFTER this one) -- sec.data.events here is single/multi
  // duels only.
  const kindLabel = { single: "单挑", multi: "乱斗" };
  const kindIcon = { single: "⚔️", multi: "⚔️" };
  container.innerHTML = `
    ${roleBonusesHtml(sec.data.roleBonuses)}
    ${sec.data.events.length ? sec.data.events.map((ev) => {
      const players = ev.playerIds.map((id) => draft.working.find((p) => p.id === id)).filter(Boolean);
      // 8/9's "opponent has no gun -> direct loss" rule only has a clean
      // reading for a 2-player duel (see the matching comment in
      // server.js's commitSectionEffect) -- shown here purely so admin sees
      // *why* the number came out the way it did, not computed differently.
      let autoLossId = null;
      if (ev.kind === "single" && players.length === 2) {
        const [a, b] = players;
        const aGun = hasGun(playerItemsClient(state, a.id));
        const bGun = hasGun(playerItemsClient(state, b.id));
        if (aGun && !bGun) autoLossId = b.id;
        else if (bGun && !aGun) autoLossId = a.id;
      }
      return `
        <div class="settlement-event-group">
          <div style="font-weight:700;margin-bottom:6px;">${getRoomLabel(ev.room)} — ${kindLabel[ev.kind]}</div>
          <div style="overflow-x:auto;"><table class="stats-table">
            <thead><tr><th>玩家</th><th>武力</th><th>结算前</th><th>结算后</th><th>变化</th></tr></thead>
            <tbody>${players.map((p) => {
              const delta = settlementHealthDelta(deltas, p.id);
              const { before, after } = settlementBeforeAfter(sec, p.id, p.health, delta);
              const badges = weaponBadgesHtml(playerItemsClient(state, p.id));
              const roleBonusPower = roleBonusPowerFor(p.id, sec.data.roleBonuses);
              const powerBase = roleBonusPower ? `${p.stats.power}+${roleBonusPower}=${p.stats.power + roleBonusPower}` : `${p.stats.power}`;
              const powerCell = badges ? `${powerBase} <span style="color:#8b9482;">${badges}</span>` : powerBase;
              const autoLossTag = p.id === autoLossId ? `<span class="pill-tag red" style="margin-left:6px;">对方持枪，直接判负</span>` : "";
              return `<tr><td>${settlementPlayerLabel(p.id)}${p.health <= 0 ? "（暗影）" : ""}${autoLossTag}${settlementAdrenalineTagHtml(sec, deltas, p.id)}${settlementUndertakerTagHtml(sec, p.id)}</td><td>${powerCell}</td><td>${settlementHealthText(before)}</td><td>${settlementHealthText(after)}</td><td>${settlementDeltaText(delta, kindIcon[ev.kind], sec.committed)}</td></tr>`;
            }).join("")}</tbody>
          </table></div>
        </div>`;
    }).join("") : `<div style="color:#8b9482;font-size:13px;">本轮没有房间发生战斗、乱斗事件。</div>`}
    ${settlementFooterHtml(sec)}
  `;
  wireSettlementFooter(container, "combat");
}

// Runs AFTER "combat" (see server.js's computeShadowMeetEvents) -- who's
// "living" here already reflects anyone just killed by this round's own
// fights, so a Shadow only absorbs from whoever actually survived them.
function renderShadowMeetSection(container, sec, draft, deltas, state) {
  // 暗影共鸣 is a global passive -- 暗影使者 doesn't need to be in any of the
  // rooms below to recover HP from them. If they're not already part of one
  // of those rooms' rows, they'd otherwise never appear anywhere in this
  // accordion even though the resonance total was still added to their
  // health, which reads as "nothing happened" even though it did. Show them
  // in their own card whenever that's the case.
  const shownIds = new Set(sec.data.events.flatMap((ev) => ev.playerIds));
  const envoy = draft.working.find((p) => p.roleId === "shadow_envoy" && p.health > 0 && !shownIds.has(p.id));
  const envoyDelta = envoy ? settlementHealthDelta(deltas, envoy.id) : 0;
  container.innerHTML = `
    ${sec.data.events.length ? sec.data.events.map((ev) => {
      const players = ev.playerIds.map((id) => draft.working.find((p) => p.id === id)).filter(Boolean);
      return `
        <div class="settlement-event-group">
          <div style="font-weight:700;margin-bottom:6px;">${getRoomLabel(ev.room)} — 暗影相遇</div>
          <div style="overflow-x:auto;"><table class="stats-table">
            <thead><tr><th>玩家</th><th>结算前</th><th>结算后</th><th>变化</th></tr></thead>
            <tbody>${players.map((p) => {
              const delta = settlementHealthDelta(deltas, p.id);
              const { before, after } = settlementBeforeAfter(sec, p.id, p.health, delta);
              const envoyTag = p.roleId === "shadow_envoy" && p.health > 0 ? `<span class="pill-tag green" style="margin-left:6px;">🌙 暗影共鸣免疫</span>` : "";
              return `<tr><td>${settlementPlayerLabel(p.id)}${p.health <= 0 ? "（暗影）" : ""}${envoyTag}${settlementAdrenalineTagHtml(sec, deltas, p.id)}${settlementUndertakerTagHtml(sec, p.id)}</td><td>${settlementHealthText(before)}</td><td>${settlementHealthText(after)}</td><td>${settlementDeltaText(delta, "👻", sec.committed)}</td></tr>`;
            }).join("")}</tbody>
          </table></div>
        </div>`;
    }).join("") : `<div style="color:#8b9482;font-size:13px;">本轮没有房间发生暗影与人相遇事件。</div>`}
    ${envoy && envoyDelta ? (() => {
      const { before, after } = settlementBeforeAfter(sec, envoy.id, envoy.health, envoyDelta);
      return `
        <div class="settlement-event-group">
          <div style="font-weight:700;margin-bottom:6px;">🌙 暗影共鸣（不在同一房间也会触发，来自本轮其他房间的暗影吸取）</div>
          <div style="overflow-x:auto;"><table class="stats-table">
            <thead><tr><th>玩家</th><th>结算前</th><th>结算后</th><th>变化</th></tr></thead>
            <tbody><tr><td>${settlementPlayerLabel(envoy.id)}</td><td>${settlementHealthText(before)}</td><td>${settlementHealthText(after)}</td><td>${settlementDeltaText(envoyDelta, "🌙", sec.committed)}</td></tr></tbody>
          </table></div>
        </div>`;
    })() : ""}
    ${settlementFooterHtml(sec)}
  `;
  wireSettlementFooter(container, "shadow_meet");
}

// 化学家's "毒性调和" is set from the 地图 tab BEFORE 结算 opens (see
// openChemistActionModal) -- this section only displays whatever was
// chosen, read-only, since editing it here would retroactively change a
// section whose default was already frozen from state.chemistAction the
// moment 结算 started (same reasoning as the map-lock on rooms/votes/rocket).
function chemistActionSummaryHtml(sec, state) {
  const chemist = state.players.find((p) => p.roleId === "chemist");
  if (!state.rolesEnabled || !chemist) return "";
  const action = sec.data.chemistAction;
  const text = !action ? "本轮未使用"
    : action.type === "reduce" ? `削弱：${getRoomLabel(action.room)} 本轮-2（最低为0）`
    : "增强：本轮新增毒气楼层伤害+2";
  return `<div style="margin-bottom:12px;font-size:14px;">🧪 化学家（玩家 ${chemist.id}）· 毒性调和：<b>${text}</b>（结算开始前请到"地图"标签设置）</div>`;
}

function renderPoisonSection(container, sec, draft, deltas, state) {
  const floors = sec.data.floors; // all currently-active poison floors -- this is what deals damage below
  const newFloors = sec.data.newFloors || [];
  const affected = draft.working.filter((p) => p.health > 0 && isRoomPoisonedClient(p.room, floors, state.detoxifiedRooms));
  const tallyEntries = Object.entries(sec.data.tally);
  container.innerHTML = `
    <div style="margin-bottom:8px;font-size:14px;">投票结果：${tallyEntries.length ? tallyEntries.map(([f, c]) => `${f} 楼（${c} 票）`).join("，") : "本轮无人投票"}</div>
    <div style="margin-bottom:4px;font-size:14px;">本轮新增"毒气"楼层：<b>${newFloors.length ? newFloors.join("、") + " 楼" : "无"}</b></div>
    <div style="margin-bottom:12px;font-size:14px;">本轮受"毒气"影响楼层（含此前已中毒，不会消散）：<b>${floors.length ? floors.join("、") + " 楼" : "无"}</b></div>
    ${chemistActionSummaryHtml(sec, state)}
    ${affected.length ? `
      <div style="overflow-x:auto;"><table class="stats-table">
        <thead><tr><th>玩家</th><th>房间</th><th>结算前</th><th>结算后</th><th>变化</th></tr></thead>
        <tbody>${affected.map((p) => {
          const delta = settlementHealthDelta(deltas, p.id);
          const { before, after } = settlementBeforeAfter(sec, p.id, p.health, delta);
          const gasMask = playerItemsClient(state, p.id).gasMask;
          const justRevived = state.players.find((pp) => pp.id === p.id)?.revivedProtectedRound === state.round;
          const immuneTag = gasMask ? `<span class="pill-tag green" style="margin-left:6px;">😷 防毒面具免疫</span>`
            : justRevived ? `<span class="pill-tag green" style="margin-left:6px;">✨ 复活首轮免疫</span>` : "";
          return `<tr><td>${settlementPlayerLabel(p.id)}${immuneTag}${settlementAdrenalineTagHtml(sec, deltas, p.id)}${settlementChemistTagHtml(sec, deltas, p.id)}${settlementUndertakerTagHtml(sec, p.id)}</td><td>${getRoomLabel(p.room)}</td><td>${settlementHealthText(before)}</td><td>${settlementHealthText(after)}</td><td>${settlementDeltaText(delta, "☠️", sec.committed)}</td></tr>`;
        }).join("")}</tbody>
      </table></div>` : `<div style="color:#8b9482;font-size:13px;">没有存活玩家处于本轮"毒气"楼层。</div>`}
    ${settlementFooterHtml(sec)}
  `;
  wireSettlementFooter(container, "poison");
}

function renderHungerSection(container, sec, draft, state, deltas) {
  const entries = Object.entries(sec.data.toggles);
  container.innerHTML = `
    ${state.round < 2 ? `<div style="color:#8b9482;font-size:13px;margin-bottom:12px;">第 2 回合起才需要上交水/粮，本轮不产生影响。</div>` : ""}
    <div style="color:#8b9482;font-size:13px;margin-bottom:12px;">开关开启 = 该玩家已上交；关闭 = 未上交，缺水或缺粮各扣 1 点生命（缺两项共扣 2 点）。</div>
    ${entries.length ? `
      <div style="overflow-x:auto;"><table class="stats-table">
        <thead><tr><th>玩家</th><th>水</th><th>粮</th><th>结算前</th><th>结算后</th><th>变化</th></tr></thead>
        <tbody>${entries.map(([pid, t]) => {
          const p = draft.working.find((pp) => pp.id === Number(pid));
          if (!p) return "";
          const delta = settlementHealthDelta(deltas, pid);
          const { before, after } = settlementBeforeAfter(sec, p.id, p.health, delta);
          const locked = sec.committed || t.exempt;
          const waterFoodCells = t.exempt
            ? `<td colspan="2" style="color:#8b9482;">${t.reason === "revived" ? "复活首轮免疫" : "在 B204 餐厅"}</td>`
            : `<td>${settlementSwitchHtml("settlement-hunger-toggle", `data-pid="${pid}" data-field="water"`, t.water, locked)}</td>
               <td>${settlementSwitchHtml("settlement-hunger-toggle", `data-pid="${pid}" data-field="food"`, t.food, locked)}</td>`;
          return `<tr>
            <td>${settlementPlayerLabel(pid)}${settlementAdrenalineTagHtml(sec, deltas, p.id)}${settlementUndertakerTagHtml(sec, p.id)}</td>
            ${waterFoodCells}
            <td>${settlementHealthText(before)}</td><td>${settlementHealthText(after)}</td><td>${settlementDeltaText(delta, "🍽️", sec.committed)}</td>
          </tr>`;
        }).join("")}</tbody>
      </table></div>` : `<div style="color:#8b9482;font-size:13px;">没有存活玩家。</div>`}
    ${settlementFooterHtml(sec)}
  `;
  container.querySelectorAll(".settlement-hunger-toggle").forEach((cb) => {
    cb.addEventListener("change", () => {
      const pid = cb.dataset.pid;
      const field = cb.dataset.field;
      const newToggles = { ...sec.data.toggles, [pid]: { ...sec.data.toggles[pid], [field]: cb.checked } };
      socket.send({ type: "admin:settlementSetSectionData", section: "hunger", data: { toggles: newToggles }, password: adminPassword });
    });
  });
  wireSettlementFooter(container, "hunger");
}

        <tbody>${players.map((p) => {
          const delta = settlementHealthDelta(deltas, p.id);
          const { before, after } = settlementBeforeAfter(sec, p.id, p.health, delta);
          return `<tr><td>${settlementPlayerLabel(p.id)}${settlementAdrenalineTagHtml(sec, deltas, p.id)}${settlementUndertakerTagHtml(sec, p.id)}</td><td>${settlementHealthText(before)}</td><td>${settlementHealthText(after)}</td><td>${settlementDeltaText(delta, "🚀", sec.committed)}</td></tr>`;

}

const SETTLEMENT_WINE_RESULTS = [
  { value: 1, icon: "🗑️", short: "丢弃道具", label: "1：丢弃所有道具卡" },
  { value: 2, icon: "💤", short: "无事发生", label: "2：无事发生" },
  { value: 3, icon: "💪", short: "武力+1", label: "3：武力永久 +1" },
  { value: 4, icon: "🏃", short: "速度+1", label: "4：速度永久 +1" },
  { value: 5, icon: "💼", short: "负重+1", label: "5：负重永久 +1" },
  { value: 6, icon: "❤️", short: "生命+2", label: "6：生命 +2" },
];

// A row of 6 icon chips (one per dice face) instead of a plain <select> --
// hover/long-press shows the full rule text via the title attribute, and the
// current pick's short label is spelled out underneath so it's still
// readable without hovering.
function wineResultPickerHtml(pid, wineResult, disabled) {
  const current = SETTLEMENT_WINE_RESULTS.find((w) => w.value === wineResult);
  return `
    <div class="wine-picker">
      <div class="wine-picker-chips">
        ${SETTLEMENT_WINE_RESULTS.map((w) => `
          <button type="button" class="wine-chip ${wineResult === w.value ? "selected" : ""}" data-pid="${pid}" data-value="${w.value}" title="${w.label}" ${disabled ? "disabled" : ""}>${w.icon}</button>
        `).join("")}
      </div>
      <div class="wine-picker-caption">${current ? current.short : "未选择骰子结果"}</div>
    </div>`;
}

function renderItemsSection(container, sec, draft, deltas) {
  const entries = Object.entries(sec.data.toggles);
  container.innerHTML = `
    ${entries.length ? `
      <div style="overflow-x:auto;"><table class="stats-table">
        <thead><tr><th>玩家</th><th>药片</th><th>酒</th><th>酒·结果</th><th>肾上腺素</th><th>结算前</th><th>结算后</th><th>变化</th></tr></thead>
        <tbody>${entries.map(([pid, t]) => {
          const p = draft.working.find((pp) => pp.id === Number(pid));
          if (!p) return "";
          const delta = settlementHealthDelta(deltas, pid);
          const { before, after } = settlementBeforeAfter(sec, p.id, p.health, delta);
          const variance = [];
          if (t.pill) variance.push("💊生命+2");
          if (t.wine && t.wineResult === 6) variance.push("🍷生命+2");
          if (t.wine && t.wineResult === 3) variance.push("🍷武力+1");
          if (t.wine && t.wineResult === 4) variance.push("🍷速度+1");
          if (t.wine && t.wineResult === 5) variance.push("🍷负重+1");
          if (t.wine && t.wineResult === 1) variance.push("🍷丢弃道具");
          if (t.adrenaline) variance.push("💉下轮保护");
          return `<tr>
            <td>${settlementPlayerLabel(pid)}</td>
            <td>${settlementSwitchHtml("settlement-item-toggle", `data-pid="${pid}" data-field="pill"`, t.pill, sec.committed)}</td>
            <td>${settlementSwitchHtml("settlement-item-toggle", `data-pid="${pid}" data-field="wine"`, t.wine, sec.committed)}</td>
            <td>${t.wine ? wineResultPickerHtml(pid, t.wineResult, sec.committed) : "-"}</td>
            <td>${settlementSwitchHtml("settlement-item-toggle", `data-pid="${pid}" data-field="adrenaline"`, t.adrenaline, sec.committed)}</td>
            <td>${settlementHealthText(before)}</td><td>${settlementHealthText(after)}</td><td>${variance.join(" ") || "-"}</td>
          </tr>`;
        }).join("")}</tbody>
      </table></div>` : `<div style="color:#8b9482;font-size:13px;">没有存活玩家。</div>`}
    ${settlementFooterHtml(sec)}
  `;
  container.querySelectorAll(".settlement-item-toggle").forEach((cb) => {
    cb.addEventListener("change", () => {
      const pid = cb.dataset.pid;
      const field = cb.dataset.field;
      const newToggles = { ...sec.data.toggles, [pid]: { ...sec.data.toggles[pid], [field]: cb.checked } };
      socket.send({ type: "admin:settlementSetSectionData", section: "items", data: { toggles: newToggles }, password: adminPassword });
    });
  });
  container.querySelectorAll(".wine-chip").forEach((btn) => {
    btn.addEventListener("click", () => {
      const pid = btn.dataset.pid;
      const newToggles = { ...sec.data.toggles, [pid]: { ...sec.data.toggles[pid], wineResult: Number(btn.dataset.value) } };
      socket.send({ type: "admin:settlementSetSectionData", section: "items", data: { toggles: newToggles }, password: adminPassword });
    });
  });
  wireSettlementFooter(container, "items");
}

function renderRevivalSection(container, sec, draft, deltas) {
  const entries = Object.entries(sec.data.absorbedThisRound);
  container.innerHTML = `
    ${entries.length ? `
      <div style="overflow-x:auto;"><table class="stats-table">
        <thead><tr><th>玩家</th><th>本轮吸取</th><th>结算前</th><th>结算后</th><th>状态</th></tr></thead>
        <tbody>${entries.map(([pid, absorbed]) => {
          const p = draft.working.find((pp) => pp.id === Number(pid));
          if (!p) return "";
          const delta = settlementHealthDelta(deltas, pid);
          const { before, after } = settlementBeforeAfter(sec, p.id, p.health, delta);
          const revived = sec.committed && sec.applied && sec.applied.revivedIds.includes(Number(pid));
          return `<tr><td>${settlementPlayerLabel(pid)}</td><td>+${absorbed}</td><td>${settlementHealthText(before)}</td><td>${settlementHealthText(after)}</td><td>${revived ? "✅ 复活" : sec.committed ? "仍为暗影" : "-"}</td></tr>`;
        }).join("")}</tbody>
      </table></div>` : `<div style="color:#8b9482;font-size:13px;">本轮没有暗影玩家与存活玩家同处一室。</div>`}
    ${settlementFooterHtml(sec)}
  `;
  wireSettlementFooter(container, "revival");
}

function renderSettlementSectionBody(container, key, draft, state) {
  const sec = draft.sections[key];
  const deltas = sec.committed && sec.applied ? sec.applied : previewSectionDeltas(key, sec, draft, state);
  if (key === "surgery") renderSurgerySection(container, sec, draft, deltas);
  else if (key === "combat") renderCombatSection(container, sec, draft, deltas, state);
  else if (key === "shadow_meet") renderShadowMeetSection(container, sec, draft, deltas, state);
  else if (key === "poison") renderPoisonSection(container, sec, draft, deltas, state);
  else if (key === "hunger") renderHungerSection(container, sec, draft, state, deltas);
  else if (key === "rocket") renderRocketSection(container, sec, draft, deltas);
  else if (key === "items") renderItemsSection(container, sec, draft, deltas);
  else if (key === "revival") renderRevivalSection(container, sec, draft, deltas);
}

function renderSettlementTab(tabBody, state) {
  const draft = state.settlementDraft;
  if (!draft || draft.round !== state.round) {
    tabBody.innerHTML = `
      <div class="card" style="text-align:center;color:#8b9482;">
        点击上方"结算"按钮开始本轮结算。
      </div>`;
    return;
  }
  // 入殓师's "每当有勇士变成暗影，你的负重永久+1" can trigger from whichever
  // section actually causes a death (combat, shadow_meet, poison, hunger, or
  // rocket -- see commitSectionEffect's shared clamp loop), so rather than
  // duplicate a dedicated card in each of those renderers (like 暗影使者's
  // resonance card), this one summary line covers all of them at once,
  // tallied from every section committed so far this round.
  const undertaker = state.rolesEnabled ? state.players.find((p) => p.roleId === "undertaker" && p.health > 0) : null;
  let undertakerGainTotal = 0;
  if (undertaker) {
    for (const s of SETTLEMENT_SECTIONS) {
      const sec = draft.sections[s.key];
      if (sec.committed && sec.applied && sec.applied.extra && sec.applied.extra.undertakerGains) {
        undertakerGainTotal += sec.applied.extra.undertakerGains[undertaker.id] || 0;
      }
    }
  }
  tabBody.innerHTML = `
    <div class="card">
      <div style="font-weight:700;font-size:16px;margin-bottom:4px;">结算阶段 · 第 ${draft.round} 回合</div>
      <div style="font-size:13px;color:#8b9482;margin-bottom:16px;">逐项提交后仅管理员可见，全部 8 项提交后点击上方"结算完成"才会一次性生效给所有玩家。</div>
      ${undertaker ? `<div style="font-size:13px;color:#d8b258;margin-bottom:16px;">🪦 入殓师（玩家 ${undertaker.id}）· 每当有玩家变成暗影，负重永久+1${undertakerGainTotal ? `（本轮已生效 ${undertakerGainTotal} 次，负重+${undertakerGainTotal}）` : "（本轮暂无触发）"}</div>` : ""}
      <div class="settlement-accordion">
        ${SETTLEMENT_SECTIONS.map((s) => {
          const sec = draft.sections[s.key];
          const expanded = expandedSettlementSection === s.key;
          return `
            <div class="settlement-section ${expanded ? "expanded" : ""}">
              <div class="settlement-section-header" data-section="${s.key}">
                <span>${s.title}</span>
                <span class="pill-tag ${sec.committed ? "green" : "amber"}">${sec.committed ? "已提交" : "待处理"}</span>
              </div>
              <div class="settlement-section-body" id="settlement-body-${s.key}" style="${expanded ? "" : "display:none;"}"></div>
            </div>`;
        }).join("")}
      </div>
    </div>`;

  tabBody.querySelectorAll(".settlement-section-header").forEach((header) => {
    header.addEventListener("click", () => {
      const key = header.dataset.section;
      expandedSettlementSection = expandedSettlementSection === key ? null : key;
      render();
    });
  });

  for (const s of SETTLEMENT_SECTIONS) {
    if (expandedSettlementSection !== s.key) continue;
    const bodyEl = tabBody.querySelector(`#settlement-body-${s.key}`);
    renderSettlementSectionBody(bodyEl, s.key, draft, state);
  }
}

function render() {
  const state = latestState;
  if (!state) return;
  if (state.phase === "setup") renderSetup(state);
  else if (state.phase === "ended") renderEndedAdmin(state);
  else renderDashboard(state);
}

    tabBody.innerHTML = `

  } else if (adminTab === "timer") {

function renderMeepleTray(tray, state) {
  if (!tray) return;
  const unplaced = state.players.filter((p) => !p.room);
  tray.innerHTML = unplaced.length
    ? unplaced.map((p) => `<div class="meeple" data-player-id="${p.id}" style="background:${meepleColor(p.id)};">${p.id}</div>`).join("")
    : `<span class="meeple-tray-empty">所有玩家已放置到房间</span>`;
}

// Pointer Events (not native HTML5 drag-and-drop) so this works with touch on
// phones/tablets, not just mouse.
// Styled replacement for a native alert() -- a brief top-center toast that
// fades itself out, used for admin actions the server would otherwise just
// silently reject (nothing else in this app surfaces those any other way).
function showAdminToast(message) {
  let stack = document.getElementById("admin-toast-stack");
  if (!stack) {
    stack = document.createElement("div");
    stack.id = "admin-toast-stack";
    stack.className = "admin-toast-stack";
    document.body.appendChild(stack);
  }
  const toast = document.createElement("div");
  toast.className = "admin-toast";
  toast.textContent = message;
  stack.appendChild(toast);
  setTimeout(() => {
    toast.classList.add("leaving");
    toast.addEventListener("animationend", () => toast.remove(), { once: true });
  }, 2600);
}

function attachMeepleDrag(el, state) {
  el.classList.add("draggable");
  el.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 && e.pointerType === "mouse") return;
    e.preventDefault();
    const playerId = Number(el.dataset.playerId);
    // Captured before the drag starts so "moving OUT of 201" can be
    // detected on drop -- state.players itself doesn't change until the
    // server round-trips setPlayerRoom back, so this is still accurate at
    // pointerdown time regardless of how the drag ends.
    const fromRoom = (state.players.find((p) => p.id === playerId) || {}).room;

    const ghost = document.createElement("div");
    ghost.className = "meeple-drag-ghost";
    ghost.style.background = meepleColor(playerId);
    ghost.textContent = playerId;
    ghost.style.left = e.clientX + "px";
    ghost.style.top = e.clientY + "px";
    document.body.appendChild(ghost);
    el.classList.add("dragging");

    let lastHover = null;
    function findDropTarget(x, y) {
      const under = document.elementFromPoint(x, y);
      if (!under) return null;
      // The 102 "pass-through" zone sits right next to the room on the map
      // but isn't a room itself -- dropping there never touches this
      // player's actual room position, only the laser-damage mark.
      const laserZone = under.closest(".laser-mark-zone");
      if (laserZone) return { kind: "laser", el: laserZone };
      // Same idea as the 102 zone above, for 201 (基因库)'s stat bonus.
      const geneZone = under.closest(".gene-mark-zone");
      if (geneZone) return { kind: "gene", el: geneZone };
      const room = under.closest(".room");
      if (room && !TRANSIT_ROOM_IDS.includes(room.dataset.roomId)) {
        return { kind: "room", el: room, room: room.dataset.roomId };
      }
      // Dropping on a floor label records a poison-vote indicator only —
      // it never touches this player's actual room position.
      const floorChip = under.closest(".floor-chip");
      if (floorChip) return { kind: "floor", el: floorChip, floor: floorChip.dataset.floor };
      const tray = under.closest("#meeple-tray");
      if (tray) return { kind: "tray", el: tray };
      return null;
    }
    function onMove(ev) {
      ghost.style.left = ev.clientX + "px";
      ghost.style.top = ev.clientY + "px";
      const target = findDropTarget(ev.clientX, ev.clientY);
      const hoverEl = target ? target.el : null;
      if (hoverEl !== lastHover) {
        if (lastHover) lastHover.classList.remove("drop-hover");
        if (hoverEl) hoverEl.classList.add("drop-hover");
        lastHover = hoverEl;
      }
    }
    function onUp(ev) {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      document.body.removeChild(ghost);
      el.classList.remove("dragging");
      if (lastHover) lastHover.classList.remove("drop-hover");

      const target = findDropTarget(ev.clientX, ev.clientY);
      if (target && target.kind === "room") {
        socket.send({ type: "admin:setPlayerRoom", playerId, room: target.room, password: adminPassword });
        // 102 (激光室)/201 (基因库)'s effects are a separate manual flag on
        // top of the normal move -- always relocate them there, then ask
        // separately whether to also mark this round's effect.
        if (target.room === "102") {
          openLaserMarkConfirmModal(playerId, "stop", state);
        } else if (target.room === "201") {
          // Chained (not opened together) -- 201 only connects down to the
          // rest of the map via 102's ladder (see the map art), so arriving
          // from anywhere except 102 itself also passes through it, but
          // showing both confirm popups at once left a second full-screen
          // overlay sitting invisibly behind the first if admin only
          // noticed and dismissed the front one, silently eating every
          // click/drag afterward since it still covered the whole screen.
          openGeneMarkConfirmModal(playerId, "stop", state, () => {
            if (fromRoom && fromRoom !== "102") openLaserMarkConfirmModal(playerId, "pass", state);
          });
        } else {
          // B304 (操作室)'s "可立即重新分配自己的基因点数" -- resolved LAST in
          // the chain, after any leaving-201 business (if that's where they
          // came from), so only one modal is ever on screen at a time.
          const afterLeaving201 = () => {
            if (target.room === "B304") openStatsReallocConfirmModal(playerId, state);
          };
          if (fromRoom === "201") {
            // Leaving 201 for anywhere that isn't 102 also passes back
            // through the same ladder; once that's resolved, separately
            // offer to undo an existing 201 mark rather than leaving it
            // stuck on someone no longer there (they can also just click
            // the badge directly; this just meets them at the point where
            // it's most likely to matter).
            openLaserMarkConfirmModal(playerId, "pass", state, () => {
              if (state.geneMarks && state.geneMarks[playerId] && state.geneMarks[playerId].round === state.round) {
                openGeneMarkLeaveConfirmModal(playerId, state, afterLeaving201);
              } else {
                afterLeaving201();
              }
            });
          } else {
            afterLeaving201();
          }
        }
      } else if (target && target.kind === "laser") {
        // Merely passing through 102 -- no room change at all, purely a
        // laser-damage mark (see admin:setLaserMark).
        openLaserMarkConfirmModal(playerId, "pass", state);
      } else if (target && target.kind === "gene") {
        // Merely passing through 201 -- no room change at all, purely a
        // stat-bonus mark (see admin:setGeneMark).
        openGeneMarkConfirmModal(playerId, "pass", state);
      } else if (target && target.kind === "floor") {
        const votingPlayer = state.players.find((p) => p.id === playerId);
        if (votingPlayer && votingPlayer.health <= 0) {
          showAdminToast(`玩家 ${playerId} 已成为暗影，无法参与毒气投票`);
        } else if (state.poisonFloors.includes(target.floor)) {
          // "毒气" never dissipates once a floor is poisoned (see
          // isRoomPoisoned in server.js) -- a vote for it this round can
          // only ever be wasted, so it's blocked at the source instead of
          // silently doing nothing once the server drops it too.
          showAdminToast(`${target.floor} 楼已是"毒气"楼层，无需再投票`);
        } else {
          socket.send({ type: "admin:setFloorVote", playerId, floor: target.floor, password: adminPassword });
        }
      } else if (target && target.kind === "tray") {
        socket.send({ type: "admin:setPlayerRoom", playerId, room: null, password: adminPassword });
        if (fromRoom === "201") {
          openLaserMarkConfirmModal(playerId, "pass", state, () => {
            if (state.geneMarks && state.geneMarks[playerId] && state.geneMarks[playerId].round === state.round) {
              openGeneMarkLeaveConfirmModal(playerId, state);
            }
          });
        }
      }
    }
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  });
}

// Mirrors server.js's floorVoteCapFor exactly -- display-only here (the
// server is the actual source of truth/enforcement).
function floorVoteCapFor(player, state) {
  if (player.roleId !== "opinion_leader") return 1;
  const others = Math.max(0, (state.playerCount || 0) - 1);
  return 1 + others * 2;
}
function floorVoteUsedFor(player, state) {
  const votes = (state.floorVotes && state.floorVotes[player.id]) || [];
  return Math.max(0, votes.length - 1); // the first vote is everyone's normal baseline, not a "bonus" use
}

// Small colored dots on each floor-column label showing which players'
// tokens were dragged there this round — purely a voting indicator. Clicking
// a dot cancels that one player's vote (same effect as dragging their token
// back off the floor label), without needing to touch the drag interaction.
function renderFloorVoteBadges(mapEl, state, locked) {
  mapEl.querySelectorAll(".floor-vote-badges").forEach((el) => el.remove());
  mapEl.querySelectorAll(".floor-chip.has-votes").forEach((el) => el.classList.remove("has-votes"));
  // Each player's entry is an array of floor votes -- 意见领袖 can have
  // several, including more than one for the SAME floor, so a player's dot
  // can legitimately appear more than once within one floor's cluster.
  const votesByFloor = {};
  for (const [playerId, floors] of Object.entries(state.floorVotes || {})) {
    for (const floor of floors) (votesByFloor[floor] = votesByFloor[floor] || []).push(Number(playerId));
  }
  for (const [floor, playerIds] of Object.entries(votesByFloor)) {
    const chip = mapEl.querySelector(`.floor-chip[data-floor="${floor}"]`);
    if (!chip) continue;
    chip.classList.add("has-votes");
    const badges = document.createElement("div");
    badges.className = "floor-vote-badges";
    badges.innerHTML = playerIds.map((pid) => `<span class="floor-vote-dot${locked ? " locked" : ""}" data-vote-pid="${pid}" data-vote-floor="${floor}" title="${locked ? "结算阶段已锁定" : "点击取消该玩家在此楼层的一票"}" style="background:${meepleColor(pid)};">${pid}</span>`).join("");
    chip.appendChild(badges);
  }
  if (locked) return; // 结算 is open -- votes are frozen into the draft, no more editing until 取消结算
  mapEl.querySelectorAll(".floor-vote-dot[data-vote-pid]").forEach((dot) => {
    dot.addEventListener("click", (e) => {
      e.stopPropagation(); // don't also trigger the chip's own poison-toggle click
      socket.send({ type: "admin:setFloorVote", playerId: Number(dot.dataset.votePid), floor: dot.dataset.voteFloor, action: "remove", password: adminPassword });
    });
  });
}

// Same Pointer Events drag pattern as attachMeepleDrag, but for the single
// Rocket Launcher icon — only rooms are valid drop targets (no tray/floor).
function attachRocketDrag(el) {
  if (!el) return;
  el.classList.add("draggable");
  el.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 && e.pointerType === "mouse") return;
    e.preventDefault();

    const ghost = document.createElement("div");
    ghost.className = "rocket-drag-ghost";
    ghost.textContent = "🚀";
    ghost.style.left = e.clientX + "px";
    ghost.style.top = e.clientY + "px";
    document.body.appendChild(ghost);
    el.classList.add("dragging");

    let lastHover = null;
    function findRoomTarget(x, y) {
      const under = document.elementFromPoint(x, y);
      if (!under) return null;
      const room = under.closest(".room");
      if (room && !TRANSIT_ROOM_IDS.includes(room.dataset.roomId)) return room;
      return null;
    }
    function onMove(ev) {
      ghost.style.left = ev.clientX + "px";
      ghost.style.top = ev.clientY + "px";
      const hoverEl = findRoomTarget(ev.clientX, ev.clientY);
      if (hoverEl !== lastHover) {
        if (lastHover) lastHover.classList.remove("drop-hover");
        if (hoverEl) hoverEl.classList.add("drop-hover");
        lastHover = hoverEl;
      }
    }
    function onUp(ev) {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      document.body.removeChild(ghost);
      el.classList.remove("dragging");
      if (lastHover) lastHover.classList.remove("drop-hover");

      const room = findRoomTarget(ev.clientX, ev.clientY);
      if (room) {
        socket.send({ type: "admin:setRocketTarget", room: room.dataset.roomId, password: adminPassword });
      }
    }
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  });
}

// B101 (控制室)'s function 1: "在本轮'毒气'投票中1票视为10票" -- same drag
// mechanics as attachRocketDrag above, but the icon never "holds" a single
// target; every drop onto a floor label is an independent +10 use (see
// admin:addB101VoteBoost), reusable any number of times per round since
// each player who visits B101 can trigger it.
function attachB101VoteDrag(el) {
  if (!el) return;
  el.classList.add("draggable");
  el.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 && e.pointerType === "mouse") return;
    e.preventDefault();

    const ghost = document.createElement("div");
    ghost.className = "rocket-drag-ghost";
    ghost.textContent = "🗳️";
    ghost.style.left = e.clientX + "px";
    ghost.style.top = e.clientY + "px";
    document.body.appendChild(ghost);
    el.classList.add("dragging");

    let lastHover = null;
    function findFloorTarget(x, y) {
      const under = document.elementFromPoint(x, y);
      if (!under) return null;
      return under.closest(".floor-chip");
    }
    function onMove(ev) {
      ghost.style.left = ev.clientX + "px";
      ghost.style.top = ev.clientY + "px";
      const hoverEl = findFloorTarget(ev.clientX, ev.clientY);
      if (hoverEl !== lastHover) {
        if (lastHover) lastHover.classList.remove("drop-hover");
        if (hoverEl) hoverEl.classList.add("drop-hover");
        lastHover = hoverEl;
      }
    }
    function onUp(ev) {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      document.body.removeChild(ghost);
      el.classList.remove("dragging");
      if (lastHover) lastHover.classList.remove("drop-hover");

      const chip = findFloorTarget(ev.clientX, ev.clientY);
      if (chip) {
        socket.send({ type: "admin:addB101VoteBoost", floor: chip.dataset.floor, password: adminPassword });
      }
    }
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  });
}

// Small "🗳️×N" badge on each floor label with an active B101 boost --
// same click-to-remove pattern as the floor-vote dots, one use removed
// per click (see admin:removeB101VoteBoost).
function renderB101VoteBadges(mapEl, state, locked) {
  mapEl.querySelectorAll(".b101-vote-badge").forEach((el) => el.remove());
  const counts = {};
  for (const floor of state.b101VoteBoosts || []) counts[floor] = (counts[floor] || 0) + 1;
  for (const [floor, count] of Object.entries(counts)) {
    const chip = mapEl.querySelector(`.floor-chip[data-floor="${floor}"]`);
    if (!chip) continue;
    const badge = document.createElement("span");
    badge.className = `b101-vote-badge${locked ? " locked" : ""}`;
    badge.textContent = `🗳️×${count}`;
    badge.title = locked ? "结算阶段已锁定" : "点击移除一次 B101 投票加成";
    chip.appendChild(badge);
    if (!locked) {
      badge.addEventListener("click", (e) => {
        e.stopPropagation();
        socket.send({ type: "admin:removeB101VoteBoost", floor, password: adminPassword });
      });
    }
  }
}

  return `
    <div class="stepper-inline">
      <button class="stepper-btn sm" data-pid="${pid}" data-field="${field}" data-delta="-1">－</button>
      <input type="number" class="edit-input" data-pid="${pid}" data-field="${field}" value="${value}">
      <button class="stepper-btn sm" data-pid="${pid}" data-field="${field}" data-delta="1">＋</button>
    </div>`;
}

function statsReadyTagHtml(stats) {
  const ready = isStatsReady(stats);
  return `<span class="pill-tag ${ready ? "green" : "amber"}">${ready ? "已准备" : "待分配"}</span>`;
}

// A shared room means combat/乱斗 triggers there. Each conflicted room gets
// its own stable color so admin can visually match up who's colliding where.
function roomLabelHtml(room, roomCounts, conflictColors) {
  if (!room) return "—";
  const label = ROOM_LABELS[room] || room;
  const shared = roomCounts && roomCounts[room] > 1;
  if (!shared) return label;
  // Emoji glyphs ignore CSS color in most browsers, so a colored dot is used
  // instead of a ⚠ — that's the only reliable way to distinguish which
  // conflicted room is which at a glance.
  const color = (conflictColors && conflictColors[room]) || "#ff8a80";
  return `<span style="color:${color};font-weight:700;" title="该房间有多名玩家，将触发战斗/乱斗"><span class="room-conflict-dot" style="background:${color};"></span>${label}</span>`;
}

// protectedNow = 肾上腺素 used last round -- this round can't drop below 1
// health (the clamp itself lives in server.js's commitSectionEffect). View
// mode shows this as a plain shield next to the value; edit mode turns it
// into a toggle so admin can grant/revoke the protection manually for this
// round -- as if it had actually been used last round -- without needing an
// item-card trail (see startEdit/commitEdit's draft.players[pid].adrenaline).
function healthCellHtml(pid, health, editable, protectedNow, threshold) {
  const shieldHtml = editable
    ? `<button type="button" class="stepper-btn sm" data-toggle-adrenaline="${pid}" title="点击切换：本轮肾上腺素保护（生命不会低于1）" style="${protectedNow ? "color:#4caf50;" : "color:#8b9482;opacity:0.5;"}">🛡️</button>`
    : (protectedNow ? `<span title="肾上腺素保护中：本轮生命不会低于1" style="color:#4caf50;">🛡️</span>` : "");
  return `
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
      <div style="display:flex;align-items:center;gap:4px;">
        ${editable ? fieldStepperHtml(pid, "health", health) : `<span>${health}</span>`}
        ${shieldHtml}
      </div>
      ${miniHealthBarHtml(health, threshold)}
    </div>`;
}

// Same protectedNow flag overrides the DISPLAYED speed to 10 with a syringe
// -- the player's actual stored stats.speed is untouched underneath; this is
// read-only context, so it's only shown outside edit mode (editing still
// shows/edits the real stored value via the normal stepper).
function speedCellHtml(p, protectedNow) {
  return protectedNow ? `<span style="color:#d8b258;font-weight:700;">💉10</span>` : `${p.stats.speed}`;
}

function powerCellHtml(p) {

}

// 负重 cell: 🎒 opens the item-inventory modal (immediate action, same

// Pill button (thumbnail + name) that opens the role-assign modal below —
// nicer than a plain <select>, and lets the picker show each role's image.
function roleAssignButtonHtml(p) {
  const role = getRole(p.roleId);
  return `
    <button class="role-assign-btn" data-pid="${p.id}">
      ${role ? `<img src="${role.image}" alt="${role.name}"><span>${role.name}</span>` : `<span class="role-assign-placeholder">未分配</span>`}
    </button>`;
